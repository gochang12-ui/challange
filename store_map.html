<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>정식품 점포현황 지도</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;background:#f0f2f5;color:#1a1a1a;height:100vh;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}
#header{background:#1a3a5c;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;z-index:10}
#header h1{font-size:15px;font-weight:700}
#header .sub{font-size:11px;opacity:.7;margin-left:auto}
#filters{background:#fff;border-bottom:1px solid #e0e4ea;padding:8px 12px;display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0;align-items:center;z-index:10}
.fsel{padding:5px 10px;border:1px solid #d0d5df;border-radius:6px;font-size:12px;background:#fff;cursor:pointer}
.grade-btn{padding:4px 10px;border-radius:12px;border:1.5px solid #ddd;font-size:11px;cursor:pointer;background:#fff;font-weight:600}
.grade-btn.on-SA{background:#15803d;color:#fff;border-color:#15803d}
.grade-btn.on-A{background:#2563eb;color:#fff;border-color:#2563eb}
.badge{font-size:11px;color:#666;margin-left:4px}
#main{flex:1;display:flex;overflow:hidden;position:relative}
#map{flex:1;height:100%}
#side{width:280px;background:#fff;border-left:1px solid #e0e4ea;display:flex;flex-direction:column;overflow:hidden}
#side-header{padding:10px 14px;border-bottom:1px solid #eee;font-size:12px;font-weight:700;color:#444;flex-shrink:0}
#store-list{flex:1;overflow-y:auto}
.si{padding:9px 14px;border-bottom:.5px solid #f0f0f0;cursor:pointer;transition:.1s}
.si:hover{background:#f7f9fc}
.si.sel{background:#eff6ff;border-left:3px solid #2563eb}
.sn{font-size:12px;font-weight:600;margin-bottom:3px}
.sm{font-size:10px;color:#888;display:flex;gap:6px;flex-wrap:wrap}
.gc{display:inline-block;padding:1px 5px;border-radius:3px;font-size:9px;font-weight:700;margin-right:4px}
.gSA{background:#dcfce7;color:#15803d}
.gA{background:#dbeafe;color:#1d4ed8}
.gB{background:#fef3c7;color:#92400e}
/* 상세 팝업 */
#detail{display:none;position:absolute;bottom:20px;left:calc(50% - 140px);background:#fff;border-radius:12px;
  box-shadow:0 4px 24px rgba(0,0,0,.18);padding:16px 18px;width:280px;z-index:500}
#detail h3{font-size:13px;font-weight:700;margin-bottom:10px;padding-right:20px}
.dr{display:flex;justify-content:space-between;font-size:11px;padding:4px 0;border-bottom:.5px solid #f5f5f5}
.dr:last-child{border:none}
.dl{color:#888}.dv{font-weight:600}
#dc{position:absolute;top:10px;right:12px;background:none;border:none;font-size:16px;cursor:pointer;color:#aaa}
/* 로딩 */
#loading{position:absolute;top:0;left:0;right:280px;bottom:0;background:rgba(255,255,255,.85);
  display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:400}
#loading.hide{display:none}
#prog{width:200px;background:#e5e7eb;border-radius:4px;height:6px;margin-top:10px;overflow:hidden}
#pb{background:#2563eb;height:100%;width:0%;transition:.2s}
/* 범례 */
#legend{position:absolute;bottom:16px;right:296px;background:#fff;border-radius:8px;
  box-shadow:0 2px 8px rgba(0,0,0,.12);padding:8px 12px;font-size:11px;z-index:100}
#legend div{display:flex;align-items:center;gap:6px;margin-bottom:3px}
#legend div:last-child{margin:0}
.dot{width:10px;height:10px;border-radius:50%}
@media(max-width:640px){#side{display:none}#loading{right:0}#legend{right:16px}}
</style>

var map, clusterer;

function initMap(){

  map.addControl(new kakao.maps.ZoomControl(),kakao.maps.ControlPosition.RIGHT);

    styles:[

      {width:'52px',height:'52px',background:'rgba(26,58,92,.92)',color:'#fff',textAlign:'center',lineHeight:'52px',borderRadius:'50%',fontSize:'14px',fontWeight:'700'}
    ]
  });
}

// 필터 셀렉트 초기화
function initFilters(){
  var offices=[...new Set(STORE_DATA.map(function(s){return s.office;}))].sort();
  var fo=document.getElementById('fo');
  offices.forEach(function(o){var op=document.createElement('option');op.value=op.text=o;fo.appendChild(op);});
  document.getElementById('hbadge').textContent='전체 '+STORE_DATA.length.toLocaleString()+'개 점포';
}

function onOfficeChange(){
  var off=document.getElementById('fo').value;
  var base=off?STORE_DATA.filter(function(s){return s.office===off;}):STORE_DATA;
  // 담당/대리점 목록 갱신
  var persons=[...new Set(base.map(function(s){return s.person;}).filter(Boolean))].sort();
  var agencies=[...new Set(base.map(function(s){return s.agency;}).filter(Boolean))].sort();
  var fp=document.getElementById('fp');
  var fa=document.getElementById('fa');
  fp.innerHTML='<option value="">전체 담당</option>'+persons.map(function(p){return '<option>'+p+'</option>';}).join('');
  fa.innerHTML='<option value="">전체 대리점</option>'+agencies.map(function(a){return '<option>'+a+'</option>';}).join('');
  doFilter();
}

function doFilter(){
  var off=document.getElementById('fo').value;
  var ag=document.getElementById('fa').value;
  var per=document.getElementById('fp').value;
  filteredStores=STORE_DATA.filter(function(s){
    return (!off||s.office===off)&&(!ag||s.agency===ag)&&(!per||s.person===per)&&
      (activeGrades.size===0||activeGrades.has(s.grade));
  });
  document.getElementById('fbadge').textContent=filteredStores.length.toLocaleString()+'개 표시';
  renderList();
  renderMarkers();
}

function togGrade(g){
  if(activeGrades.has(g)) activeGrades.delete(g); else activeGrades.add(g);
  document.getElementById('b'+g).className='grade-btn'+(activeGrades.has(g)?' on-'+g:'');
  doFilter();
}

function gradeColor(g){return g==='SA'?'#15803d':g==='A'?'#2563eb':'#d97706';}

function mkSVG(color){
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="22" viewBox="0 0 18 22">'+
    '<path d="M9 0C5.1 0 2 3.1 2 7c0 5.3 7 15 7 15s7-9.7 7-15C16 3.1 12.9 0 9 0z" fill="'+color+'" stroke="white" stroke-width="1.5"/>'+
    '<circle cx="9" cy="7" r="3" fill="white" opacity=".9"/></svg>');
}

// 좌표 변환
async function getCoords(dong,sido){
  var key=dong+'|'+sido;
  if(dongCache[key]!==undefined) return dongCache[key];
  var q=encodeURIComponent(dong+' '+sido);
  try{
    var r=await fetch('https://dapi.kakao.com/v2/local/search/address.json?query='+q,
      {headers:{'Authorization':'KakaoAK '+REST_KEY}});
    var d=await r.json();
    if(d.documents&&d.documents.length){
      var c={lat:parseFloat(d.documents[0].y),lng:parseFloat(d.documents[0].x)};
      dongCache[key]=c; return c;
    }
    // 키워드 재시도
    r=await fetch('https://dapi.kakao.com/v2/local/search/keyword.json?query='+q+'&size=1',
      {headers:{'Authorization':'KakaoAK '+REST_KEY}});
    d=await r.json();
    if(d.documents&&d.documents.length){
      var c2={lat:parseFloat(d.documents[0].y),lng:parseFloat(d.documents[0].x)};
      dongCache[key]=c2; return c2;
    }
  }catch(e){}
  dongCache[key]=null; return null;
}

async function renderMarkers(){
  if(converting) return;
  converting=true;
  clusterer.clear();
  markers.forEach(function(m){m.setMap(null);}); markers=[];

  // 미변환 고유 동만 추출
  var todo=[...new Set(filteredStores.map(function(s){
    return s.dong+'|'+(SIDO[s.office]||'');
  }))].filter(function(k){return dongCache[k]===undefined;});

  if(todo.length>0){
    document.getElementById('loading').classList.remove('hide');
    var done=0, total=todo.length;
    var BATCH=5;
    for(var i=0;i<todo.length;i+=BATCH){
      var batch=todo.slice(i,i+BATCH);
      await Promise.all(batch.map(async function(dk){
        var parts=dk.split('|');
        await getCoords(parts[0],parts[1]);
        done++;
        document.getElementById('pb').style.width=Math.round(done/total*100)+'%';
        document.getElementById('lt').textContent=done+'/'+total+'개 동 변환 중...';
      }));
      await new Promise(function(r){setTimeout(r,100);});
    }
  }
  document.getElementById('loading').classList.add('hide');

  // 마커 생성
  var newM=[];
  filteredStores.forEach(function(s){
    var key=s.dong+'|'+(SIDO[s.office]||'');
    var c=dongCache[key];
    if(!c) return;
    var lat=c.lat+(Math.random()-.5)*0.0008;
    var lng=c.lng+(Math.random()-.5)*0.0008;
    var img=new kakao.maps.MarkerImage(mkSVG(gradeColor(s.grade)),new kakao.maps.Size(18,22));
    var mk=new kakao.maps.Marker({position:new kakao.maps.LatLng(lat,lng),image:img});
    mk._s=s;
    kakao.maps.event.addListener(mk,'click',function(){showDetail(s,mk);});
    newM.push(mk);
  });
  markers=newM;
  clusterer.addMarkers(markers);

  if(markers.length){
    var bounds=new kakao.maps.LatLngBounds();
    markers.slice(0,300).forEach(function(m){bounds.extend(m.getPosition());});
    map.setBounds(bounds);
  }
  converting=false;
}

function renderList(){
  var el=document.getElementById('store-list');
  document.getElementById('lcnt').textContent=filteredStores.length.toLocaleString()+'개';
  var html=filteredStores.slice(0,300).map(function(s){
    var gc='gc g'+(s.grade||'B');
    return '<div class="si" id="si'+s.id+'" onclick="clickList('+s.id+')">'+
      '<div class="sn"><span class="'+gc+'">'+(s.grade||'─')+'</span>'+s.name+'</div>'+
      '<div class="sm"><span>'+s.office.replace('영업소','')+'</span><span>'+s.agency+'</span><span>'+s.dong+'</span>'+
      (s.sales?'<span>'+s.sales.toLocaleString()+'천원</span>':'')+
      '</div></div>';
  }).join('');
  if(filteredStores.length>300) html+='<div style="padding:10px;text-align:center;font-size:10px;color:#999">상위 300개 표시 (전체 '+filteredStores.length+'개)</div>';
  el.innerHTML=html;
}

var storeMap={};
STORE_DATA.forEach(function(s){storeMap[s.id]=s;});

function clickList(id){
  var s=storeMap[id];
  if(!s) return;
  var key=s.dong+'|'+(SIDO[s.office]||'');
  var c=dongCache[key];
  if(c) map.panTo(new kakao.maps.LatLng(c.lat,c.lng));
  map.setLevel(6);
  showDetail(s,null);
}

function showDetail(s,mk){
  document.getElementById('dn').textContent=s.name;
  document.getElementById('do').textContent=s.office;
  document.getElementById('dp').textContent=s.person||'─';
  document.getElementById('da').textContent=s.agency||'─';
  document.getElementById('dd').textContent=s.dong||'─';
  document.getElementById('dsz').textContent=s.size?s.size+'평':'─';
  document.getElementById('dg').innerHTML='<span class="gc g'+(s.grade||'B')+'">'+(s.grade||'─')+'</span>';
  document.getElementById('ds').textContent=s.sales?s.sales.toLocaleString()+'천원/월':'─';
  document.getElementById('detail').style.display='block';
  if(mk) map.panTo(mk.getPosition());
  document.querySelectorAll('.si.sel').forEach(function(e){e.classList.remove('sel');});
  var li=document.getElementById('si'+s.id);
  if(li){li.classList.add('sel');li.scrollIntoView({block:'nearest'});}
}

function closeD(){document.getElementById('detail').style.display='none';}

// 카카오 SDK 로드 후 실행
window.__mapInit=function(){
  initMap();
  initFilters();
  doFilter();
};
</script>
