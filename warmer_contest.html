<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>베지밀 온장고 진열 컨테스트</title>
<meta name="theme-color" content="#0f5132">
<style>
:root{--g:#0f5132;--g2:#16a34a;--bg:#f4f7f5;--card:#fff;--tx:#111827;--tx2:#4b5563;--tx3:#9ca3af;--bd:#d1d5db;--red:#dc2626;--gold:#b45309}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:18px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 48px}
.wide .wrap{max-width:1100px}
.top{background:var(--g);color:#fff;padding:18px 16px 14px;text-align:center}
.top h1{margin:0;font-size:23px;letter-spacing:-0.5px}
.top .per{margin-top:2px;font-size:14px;opacity:.85}
.top .rw{display:inline-block;margin-top:8px;background:#fde68a;color:#78350f;font-weight:800;font-size:15px;padding:4px 12px;border-radius:20px}
.who{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:16px;color:var(--tx2)}
.who b{color:var(--g);font-size:19px}
.who button{margin-left:auto;font-size:14px;padding:5px 10px;border:1px solid var(--bd);background:#fff;border-radius:8px;color:var(--tx2)}
.tabs{display:flex;gap:6px;margin-top:12px}
.tabs button{flex:1;font-size:17px;font-weight:800;padding:12px;border-radius:12px;border:2px solid var(--bd);background:#fff;color:var(--tx2)}
.tabs button.on{border-color:var(--g);background:var(--g);color:#fff}
.card{background:var(--card);border-radius:16px;padding:16px;margin-top:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.lab{font-size:19px;font-weight:800;margin-bottom:8px}
.lab small{font-weight:500;color:var(--tx2);font-size:14px;margin-left:4px}
.inp{width:100%;font-size:21px;padding:13px 14px;border:2px solid var(--bd);border-radius:12px;background:#fff;color:var(--tx)}
.inp:focus{outline:none;border-color:var(--g2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pick{font-size:18px;font-weight:700;padding:14px 8px;border:2px solid var(--bd);border-radius:12px;background:#fff;color:var(--tx);text-align:center;cursor:pointer}
.pick.on{border-color:var(--g);background:#ecfdf5;color:var(--g)}
.pick.mine{border-color:#86efac}
.pick small{display:block;font-size:12px;color:var(--tx3);font-weight:500}
.role{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role .pick{padding:22px 8px;font-size:22px}
.ac{border:2px solid var(--g2);border-top:0;border-radius:0 0 12px 12px;margin-top:-6px;padding-top:6px;max-height:300px;overflow:auto;background:#fff}
.ac div{padding:11px 14px;border-top:1px solid #eee;cursor:pointer}
.ac div:active,.ac div:hover{background:#f0fdf4}
.ac b{font-size:18px}
.ac span{display:block;font-size:14px;color:var(--tx2)}
.ac .new{color:var(--g);font-weight:700}
.sel{display:flex;align-items:center;gap:10px;padding:12px 14px;border:2px solid var(--g2);border-radius:12px;background:#f0fdf4}
.sel b{font-size:20px}
.sel span{font-size:14px;color:var(--tx2);display:block}
.sel button{margin-left:auto;font-size:14px;padding:6px 10px;border:1px solid var(--bd);background:#fff;border-radius:8px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{font-size:16px;padding:6px 12px;border-radius:18px;border:1px solid var(--bd);background:#fff;color:var(--tx2)}
.prods{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.prods span{background:#ecfdf5;color:var(--g);border:1px solid #a7f3d0;border-radius:20px;padding:4px 12px;font-size:15px;font-weight:700}
.guide{font-size:16px;color:var(--tx2);margin:6px 0 10px}
.guide b{color:var(--tx)}
.btn2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{display:block;width:100%;font-size:21px;font-weight:800;padding:16px;border:0;border-radius:14px;cursor:pointer}
.cam{background:#ecfdf5;color:var(--g);border:3px dashed #6ee7b7}
.alb{background:#f9fafb;color:var(--tx2);border:2px solid var(--bd);font-size:18px}
.go{background:var(--g);color:#fff;margin-top:16px}
.go:disabled{background:#9ca3af}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.th{position:relative;border-radius:10px;overflow:hidden;background:#eee;aspect-ratio:3/4}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .x{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:18px}
.th .warn{position:absolute;left:0;right:0;bottom:0;background:rgba(220,38,38,.9);color:#fff;font-size:13px;padding:3px 6px;text-align:center}
.msg{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:17px;display:none}
.msg.err{display:block;background:#fef2f2;color:var(--red);border:1px solid #fecaca}
.msg.ok{display:block;background:#ecfdf5;color:var(--g);border:1px solid #a7f3d0}
.q{position:sticky;top:0;z-index:5;background:#fffbeb;border-bottom:1px solid #fde68a;color:#92400e;font-size:15px;padding:8px 16px;text-align:center;display:none}
.q.ok{background:#ecfdf5;border-color:#a7f3d0;color:var(--g)}
.q button{font-size:14px;margin-left:8px;padding:3px 10px;border-radius:8px;border:1px solid currentColor;background:#fff;color:inherit}
.res .st{border-top:1px solid #eee;padding:12px 0;display:flex;gap:10px}
.res .st:first-child{border-top:0}
.res img{width:72px;height:92px;object-fit:cover;border-radius:8px;background:#eee;flex:none}
.res .nm{font-size:18px;font-weight:800}
.res .sub{font-size:14px;color:var(--tx2)}
.ck{display:inline-block;margin:3px 4px 0 0;padding:2px 8px;border-radius:12px;font-size:13px;font-weight:700}
.ck.o{background:#dcfce7;color:#166534}.ck.x{background:#fee2e2;color:#991b1b}.ck.u{background:#f3f4f6;color:#6b7280}
.boxes{font-size:30px;letter-spacing:2px;line-height:1.2;word-break:break-all}
.sum{text-align:center}
.sum .n{font-size:44px;font-weight:900;color:var(--gold)}
.sum .t{font-size:17px;color:var(--tx2)}
.bulk .bc{display:grid;grid-template-columns:110px 1fr;gap:10px;border:1px solid var(--bd);border-radius:12px;padding:10px;margin-top:10px;background:#fff}
.bulk .bc.join{margin-top:-4px;border-top-left-radius:0;border-top-right-radius:0;background:#f9fafb}
.bulk .bc img{width:110px;height:140px;object-fit:cover;border-radius:8px}
.bulk .inp{font-size:16px;padding:8px 10px}
.bulk select.inp{font-size:16px}
.bulk .row{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.bulk .row > *{flex:1;min-width:120px}
.bulk .tools button{font-size:13px;padding:5px 9px;border-radius:8px;border:1px solid var(--bd);background:#fff;margin:0 4px 4px 0}
.drop{border:3px dashed #6ee7b7;border-radius:14px;padding:30px;text-align:center;color:var(--g);font-weight:800;background:#ecfdf5}
.foot{text-align:center;font-size:13px;color:var(--tx3);margin-top:24px}
.lnk{color:var(--tx2);font-size:15px;text-decoration:underline;background:none;border:0;cursor:pointer}
</style>
</head>
<body>
<div class="q" id="qbar"></div>
<div class="top"><h1 id="t-name">베지밀 온장고 진열 컨테스트</h1><div class="per" id="t-per"></div><div class="rw" id="t-rw" style="display:none"></div></div>
<div class="wrap" id="app"></div>

<script>
// ═════════ 설정 ═════════
var GAS_URL='https://script.google.com/macros/s/AKfycbx_N_Qsf-3hnfU1V1Htx3suCHc-uvfqVfHNOnmTRDQdVyflwzcW-J_1kdHO327iArEu/exec';
var OFFICES=['동부영업소','서부영업소','남부영업소','북부영업소','강원영업소','충청영업소','전북영업소','전남영업소','경북영업소','경남영업소','부산영업소'];
var CFG={id:'warmer2026',name:'베지밀 온장고 진열 컨테스트',start:'',end:'',reward:'검은콩 고칼슘 24본 1박스',
  products:[{k:'A',label:'베지밀 A'},{k:'B',label:'베지밀 B'},{k:'black',label:'검은콩 고칼슘'},{k:'mogwa',label:'모과쌍화'},{k:'baedoraji',label:'배도라지'}]};
var MAXP=3;
var Q=new URLSearchParams(location.search);
function ls(k,d){ try{ var v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }
function lss(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function $(id){ return document.getElementById(id); }
function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function loc(d){ d=d||new Date(); var z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,16).replace('T',' '); }  // 기기 현지 시간 'YYYY-MM-DD HH:MM'
function norm(s){ return String(s||'').replace(/\s|\(주\)|주식회사|㈜/g,'').toLowerCase(); }
var DEV=ls('wc_dev',''); if(!DEV){ DEV='d'+Math.random().toString(36).slice(2,10); lss('wc_dev',DEV); }

// 나: {office, role:'agency'|'staff', name}
var ME=ls('wc_me',null);
if(Q.get('of')&&(!ME||ME.office!==Q.get('of'))) ME={office:Q.get('of')};
if(Q.get('ag')) ME={office:Q.get('of')||(ME&&ME.office)||'',role:'agency',name:Q.get('ag')};
var OFD=null;     // 영업소 데이터 {agencies, stores, staff}
var V={tab:'reg', step:'', agency:'', store:null, storeName:'', dong:'', photos:[], acOpen:false, mine:null, bulk:[]};
var WIDE=window.innerWidth>=900;

// ═════════ 상단 ═════════
function renderTop(){
  $('t-name').textContent=CFG.name; document.title=CFG.name;
  $('t-per').textContent=(CFG.start&&CFG.end)?('기간 '+CFG.start.replace(/-/g,'.')+' ~ '+CFG.end.replace(/-/g,'.')):'';
  var r=$('t-rw'); if(CFG.reward){ r.style.display='inline-block'; r.textContent='🎁 5종 진열 점포 1곳 = '+CFG.reward; } else r.style.display='none';
}
function loadOffice(cb){
  if(!ME||!ME.office){ cb&&cb(); return; }
  var office=ME.office, ck='wc_of_'+office, c=ls(ck,null);
  if(c&&c.at>Date.now()-6*3600e3){ OFD=c.d; OFD._of=office; cb&&cb(); }
  fetch(GAS_URL+'?action=mcContestCfg&office='+encodeURIComponent(office)).then(function(r){ return r.json(); }).then(function(d){
    if(!d||!d.success) return;
    if(d.cfg){ CFG=Object.assign(CFG,d.cfg); lss('wc_cfg',d.cfg); renderTop(); }
    var od={agencies:d.agencies||[],stores:d.stores||[],staff:d.staff||[]}; lss(ck,{at:Date.now(),d:od});
    if(!ME||ME.office!==office) return;   // 10-29: 응답이 늦게 온 이전 영업소 목록이 현재 영업소를 덮어쓰지 않게
    OFD=od; OFD._of=office;
    render();
  }).catch(function(){ if(!c&&ME&&ME.office===office){ OFD={agencies:[],stores:[],staff:[],_of:office}; render(); } });
}

// ═════════ 화면 ═════════
function render(){
  var a=$('app');
  if(!ME||!ME.office){ a.innerHTML=stepOffice(); return; }
  if(!ME.role){ a.innerHTML=stepRole(); return; }
  if(!ME.name){ a.innerHTML=stepName(); bindNameSearch(); return; }
  var h='<div class="who">'+esc(ME.office.replace('영업소',''))+' · <b>'+esc(ME.name)+'</b>'+(ME.role==='staff'?' 담당':' 대리점')+'<button onclick="resetMe()">변경</button></div>';
  var three=ME.role==='staff'||WIDE;
  h+='<div class="tabs"><button class="'+(V.tab==='reg'?'on':'')+'" onclick="setTab(\'reg\')">📷 '+(three?'등록':'사진 등록')+'</button><button class="'+(V.tab==='mine'?'on':'')+'" onclick="setTab(\'mine\')">'+(ME.role==='staff'?'📋':'🎁')+' 내 결과</button>'+
    (three?'<button class="'+(V.tab==='bulk'?'on':'')+'" onclick="setTab(\'bulk\')">🗂 여러 장</button>':'')+'</div>';
  if(V.tab==='mine') h+=viewMine();
  else if(V.tab==='bulk') h+=viewBulk();
  else h+=viewReg();
  a.innerHTML=h;
  if(V.tab==='reg') bindReg();
  if(V.tab==='bulk') bindBulk();
}
function setTab(t){ V.tab=t; if(t==='mine') loadMine(); render(); window.scrollTo(0,0); }
function resetMe(){ ME={office:ME.office}; lss('wc_me',ME); V.tab='reg'; render(); }
function stepOffice(){
  return '<div class="card"><div class="lab">우리 영업소를 눌러 주세요</div><div class="grid">'+
    OFFICES.map(function(o){ return '<div class="pick" onclick="setOffice(\''+o+'\')">'+o.replace('영업소','')+'</div>'; }).join('')+'</div>'+
    '<div class="guide" style="margin-top:12px">처음 한 번만 고르면, 다음부터는 이 휴대폰이 기억합니다.</div></div>';
}
function setOffice(o){ ME={office:o}; lss('wc_me',ME); OFD=null; loadOffice(render); render(); }
function stepRole(){
  return '<div class="who">'+esc(ME.office)+'<button onclick="ME=null;lss(\'wc_me\',null);render()">영업소 변경</button></div>'+
    '<div class="card"><div class="lab">어느 쪽이세요?</div><div class="role"><div class="pick" onclick="setRole(\'agency\')">🏪<br>대리점</div><div class="pick" onclick="setRole(\'staff\')">👔<br>정식품 담당</div></div></div>';
}
function setRole(r){ ME.role=r; lss('wc_me',ME); render(); }
function stepName(){
  if(OFD&&OFD._of&&OFD._of!==ME.office) OFD=null;
  var list=!OFD?null:(ME.role==='staff'?OFD.staff:OFD.agencies);
  var h='<div class="who">'+esc(ME.office)+' · '+(ME.role==='staff'?'담당':'대리점')+'<button onclick="ME.role=\'\';render()">뒤로</button></div><div class="card"><div class="lab">'+(ME.role==='staff'?'이름을 눌러 주세요':'우리 대리점을 눌러 주세요')+'</div>';
  if(!list) return h+'<div class="guide">목록을 불러오는 중...</div></div>';
  if(list.length>12) h+='<input id="nm-q" class="inp" placeholder="'+(ME.role==='staff'?'이름':'대리점 이름')+' 검색" style="margin-bottom:10px">';
  h+='<div class="grid" id="nm-grid">'+list.map(function(n){ return '<div class="pick" data-n="'+esc(n)+'" onclick="setName(this.getAttribute(\'data-n\'))">'+esc(n)+'</div>'; }).join('')+'</div>';
  h+='<div style="margin-top:14px"><div class="guide">목록에 없으면 직접 써 주세요'+(ME.role==='staff'?' (예: 영업소 행정 담당)':'')+'</div><div style="display:flex;gap:8px"><input id="nm-in" class="inp" placeholder="'+(ME.role==='staff'?'이름':'대리점 이름')+'"><button class="big go" style="margin:0;width:auto;padding:0 20px;font-size:18px" onclick="var v=$(\'nm-in\').value.trim();if(v)setName(v)">확인</button></div></div>';
  return h+'</div>';
}
function bindNameSearch(){ var q=$('nm-q'); if(!q) return; q.oninput=function(){ var t=norm(q.value); [].forEach.call(document.querySelectorAll('#nm-grid .pick'),function(el){ el.style.display=!t||norm(el.getAttribute('data-n')).indexOf(t)>=0?'':'none'; }); }; }
function setName(n){ ME.name=n; lss('wc_me',ME); V.tab='reg'; render(); }

// ── 등록 (휴대폰) ──
function agencyList(){
  var ags=(OFD&&OFD.agencies)||[];
  if(ME.role!=='staff') return [ME.name];
  var mine={}; (OFD&&OFD.stores||[]).forEach(function(s){ if(String(s.m||'').indexOf(ME.name)>=0) mine[s.a]=1; });
  return ags.slice().sort(function(a,b){ return (mine[b]?1:0)-(mine[a]?1:0)||a.localeCompare(b); }).map(function(a){ return {n:a,mine:!!mine[a]}; });
}
function curAgency(){ return ME.role==='staff'?(V.agency||ls('wc_last_ag_'+ME.name,'')):ME.name; }
function viewReg(){
  var ag=curAgency(), h='';
  if(ME.role==='staff'){
    var L=agencyList();
    h+='<div class="card"><div class="lab">대리점</div>';
    if(ag) h+='<div class="sel"><div><b>'+esc(ag)+'</b></div><button onclick="V.agency=\'\';lss(\'wc_last_ag_\'+ME.name,\'\');V.store=null;render()">바꾸기</button></div>';
    else h+='<input id="ag-q" class="inp" placeholder="대리점 검색" style="margin-bottom:8px"><div class="grid" id="ag-grid">'+L.map(function(x){ return '<div class="pick'+(x.mine?' mine':'')+'" data-n="'+esc(x.n)+'" onclick="pickAg(this.getAttribute(\'data-n\'))">'+esc(x.n)+(x.mine?'<small>내 담당</small>':'')+'</div>'; }).join('')+'</div>';
    h+='</div>';
    if(!ag) return h+qList();
  }
  h+='<div class="card"><div class="lab">점포 이름</div>';
  if(V.store) h+='<div class="sel"><div><b>'+esc(V.store.n)+'</b><span>'+esc(V.store.d||'')+(V.store.ad?' · '+esc(V.store.ad):'')+'</span></div><button onclick="V.store=null;V.storeName=\'\';render()">다른 점포</button></div>';
  else {
    h+='<input id="st-in" class="inp" placeholder="점포 이름 몇 글자" autocomplete="off" value="'+esc(V.storeName)+'"><div id="ac"></div>';
    h+='<div class="lab" style="margin-top:14px">동 <small>목록에 없을 때만 · 아는 동 이름 그대로</small></div><input id="dong-in" class="inp" placeholder="예: 개포동" autocomplete="off" value="'+esc(V.dong)+'">';
    var rec=ls('wc_dongs_'+norm(ag),[]); if(rec.length) h+='<div class="chips">'+rec.slice(0,6).map(function(d){ return '<button onclick="$(\'dong-in\').value=\''+esc(d)+'\';V.dong=\''+esc(d)+'\'">'+esc(d)+'</button>'; }).join('')+'</div>';
  }
  h+='</div>';
  h+='<div class="card"><div class="lab">온장고 사진 <small>최대 '+MAXP+'장</small></div><div class="guide">온장고 <b>정면</b>에서, 아래 <b>'+CFG.products.length+'가지 병</b>이 다 보이게 찍어 주세요.</div>'+
    '<div class="prods">'+CFG.products.map(function(p){ return '<span>'+esc(p.label)+'</span>'; }).join('')+'</div>'+
    '<input id="ph-cam" type="file" accept="image/*" capture="environment" style="display:none"><input id="ph-alb" type="file" accept="image/*" multiple style="display:none">';
  if(V.photos.length<MAXP) h+='<div class="btn2" style="margin-top:10px"><button class="big cam" onclick="$(\'ph-cam\').click()">📷 찍기</button><button class="big alb" onclick="$(\'ph-alb\').click()">🖼 앨범에서</button></div>';
  if(V.photos.length) h+='<div class="thumbs">'+V.photos.map(function(p,i){ return '<div class="th"><img src="'+p.dataUrl+'"><button class="x" onclick="V.photos.splice('+i+',1);render()">×</button>'+(p.warn?'<div class="warn">'+esc(p.warn)+'</div>':'')+'</div>'; }).join('')+'</div>';
  if(V.photos.some(function(p){ return p.warn; })) h+='<div class="guide" style="color:var(--red);margin-top:8px">빨간 표시 사진은 판정이 어려울 수 있어요. 다시 찍기를 권해 드려요. (그대로 등록해도 됩니다)</div>';
  h+='</div><button class="big go" id="go" onclick="submitOne()">등록하기</button><div class="msg" id="msg"></div>';
  h+=qList();
  return h;
}
function pickAg(n){ V.agency=n; lss('wc_last_ag_'+ME.name,n); V.store=null; render(); }
function storesOf(ag){ var a=norm(ag); return ((OFD&&OFD.stores)||[]).filter(function(s){ return norm(s.a)===a; }); }
function bindReg(){

// ── 사진 처리: 줄이기 + SHA-256 + dHash + 촬영일 + 상태 확인 ──
function readExifDate(buf){
  try{
    var v=new DataView(buf); if(v.getUint16(0)!==0xFFD8) return '';
    var o=2, L=Math.min(v.byteLength, 262144);
    while(o<L-4){
      var mk=v.getUint16(o), sz=v.getUint16(o+2);
      if(mk===0xFFE1 && v.getUint32(o+4)===0x45786966){
        var t=o+10, le=v.getUint16(t)===0x4949;
        var g16=function(p){ return v.getUint16(p,le); }, g32=function(p){ return v.getUint32(p,le); };
        var str=function(p,n){ var s=''; for(var i=0;i<n-1;i++){ var c=v.getUint8(p+i); if(!c) break; s+=String.fromCharCode(c); } return s; };
        var ifd=function(p,want){ var n=g16(p), r={}; for(var i=0;i<n;i++){ var e=p+2+i*12, tag=g16(e); if(want.indexOf(tag)>=0){ var cnt=g32(e+4); r[tag]=(tag===0x8769)?g32(e+8):str(t+g32(e+8),cnt); } } return r; };
        var i0=ifd(t+g32(t+4),[0x0132,0x8769]), dt='';
        if(i0[0x8769]){ var ie=ifd(t+i0[0x8769],[0x9003,0x9004]); dt=ie[0x9003]||ie[0x9004]||''; }
        dt=dt||i0[0x0132]||'';
        var m=dt.match(/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d)/); return m?(m[1]+'-'+m[2]+'-'+m[3]+' '+m[4]+':'+m[5]):'';
      }
      if((mk&0xFF00)!==0xFF00) break; o+=2+sz;
    }
  }catch(e){}
  return '';
}
function hex(buf){ return Array.prototype.map.call(new Uint8Array(buf),function(b){ return ('0'+b.toString(16)).slice(-2); }).join(''); }
function dhash(img){
  var c=document.createElement('canvas'); c.width=9; c.height=8; var x=c.getContext('2d');
  x.drawImage(img,0,0,9,8); var d=x.getImageData(0,0,9,8).data, bits='';
  for(var y=0;y<8;y++) for(var i=0;i<8;i++){ var p=(y*9+i)*4, q=p+4; var a=d[p]*.299+d[p+1]*.587+d[p+2]*.114, b=d[q]*.299+d[q+1]*.587+d[q+2]*.114; bits+=a>b?'1':'0'; }
  var h=''; for(var k=0;k<64;k+=4) h+=parseInt(bits.substr(k,4),2).toString(16); return h;
}
function quality(img){   // 너무 어둡거나 흔들림
  var W=200, H=Math.round(200*img.naturalHeight/img.naturalWidth)||200, c=document.createElement('canvas'); c.width=W; c.height=H;
  var x=c.getContext('2d'); x.drawImage(img,0,0,W,H); var d=x.getImageData(0,0,W,H).data, g=new Float32Array(W*H), sum=0;
  for(var i=0;i<W*H;i++){ g[i]=d[i*4]*.299+d[i*4+1]*.587+d[i*4+2]*.114; sum+=g[i]; }
  var mean=sum/(W*H), lap=0, n=0, lm=0;
  for(var y=1;y<H-1;y++) for(var X=1;X<W-1;X++){ var k=y*W+X, l=4*g[k]-g[k-1]-g[k+1]-g[k-W]-g[k+W]; lap+=l*l; lm+=l; n++; }
  var vr=lap/n-(lm/n)*(lm/n);
  if(mean<45) return '너무 어두워요';
  if(mean>235) return '너무 밝아요';
  if(vr<60) return '흔들렸거나 흐려요';
  return '';
}
function prepFile(f,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var buf=fr.result, exif=readExifDate(buf);
    var shaP=(window.crypto&&crypto.subtle)?crypto.subtle.digest('SHA-256',buf).then(hex):Promise.resolve('');
    var url=URL.createObjectURL(f), img=new Image();
    img.onload=function(){
      var W=img.naturalWidth, H=img.naturalHeight, M=1600, s=Math.min(1,M/Math.max(W,H));
      var c=document.createElement('canvas'); c.width=Math.round(W*s); c.height=Math.round(H*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      var p={dataUrl:c.toDataURL('image/jpeg',0.8),dhash:dhash(img),exifDate:exif,lastModified:f.lastModified?new Date(f.lastModified).toISOString():'',origW:W,origH:H,origSize:f.size,warn:quality(img),t:exif||(f.lastModified?loc(new Date(f.lastModified)):'')};
      URL.revokeObjectURL(url);
      shaP.then(function(sha){ p.sha=sha; cb(p); });
    };
    img.onerror=function(){ URL.revokeObjectURL(url); cb(null); };
    img.src=url;
  };
  fr.readAsArrayBuffer(f);
}
function addFiles(fs,done){
  fs=fs.slice(0,MAXP-V.photos.length); if(!fs.length){ done(); return; }
  var left=fs.length; fs.forEach(function(f){ prepFile(f,function(p){ if(p) V.photos.push(p); if(--left===0) done(); }); });
}

// ═════════ 전송 대기열 (IndexedDB) — 끊기면 자동 재전송 ═════════
var DB=null, QMEM=[];
function idb(cb){ if(DB) return cb(DB); try{ var r=indexedDB.open('wc_queue',1); r.onupgradeneeded=function(){ r.result.createObjectStore('q',{keyPath:'clientId'}); }; r.onsuccess=function(){ DB=r.result; cb(DB); }; r.onerror=function(){ cb(null); }; }catch(e){ cb(null); } }
function qAll(cb){ idb(function(db){ if(!db) return cb(QMEM.slice()); var out=[], t=db.transaction('q','readonly').objectStore('q').openCursor(); t.onsuccess=function(e){ var c=e.target.result; if(c){ out.push(c.value); c.continue(); } else cb(out.sort(function(a,b){ return a.at-b.at; })); }; t.onerror=function(){ cb([]); }; }); }
function qPut(it,cb){ idb(function(db){ if(!db){ QMEM=QMEM.filter(function(x){ return x.clientId!==it.clientId; }); QMEM.push(it); return cb&&cb(); } var tx=db.transaction('q','readwrite'); tx.objectStore('q').put(it); tx.oncomplete=function(){ cb&&cb(); }; tx.onerror=function(){ cb&&cb(); }; }); }
function qDel(id,cb){ idb(function(db){ if(!db){ QMEM=QMEM.filter(function(x){ return x.clientId!==id; }); return cb&&cb(); } var tx=db.transaction('q','readwrite'); tx.objectStore('q').delete(id); tx.oncomplete=function(){ cb&&cb(); }; }); }
function enqueue(o){
  o.clientId='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)+DEV.slice(-3);
  o.at=Date.now(); o.tries=0; o.state='wait';
  o.action='mcContestUpload'; o.contestId=CFG.id; o.role=ME.role; o.submitter=ME.name; o.office=ME.office; o.device=DEV;
  qPut(o,function(){ pump(); });
}
var PUMPING=false, QINFO={wait:0,fail:0,dup:[]};
function pump(){
  if(PUMPING) return; PUMPING=true;
  qAll(function(list){
    var it=list.filter(function(x){ return x.state==='wait'||(x.state==='fail'&&Date.now()-(x.last||0)>Math.min(300000,15000*Math.pow(2,x.tries))); })[0];
    QINFO.wait=list.filter(function(x){ return x.state!=='dup'; }).length; QINFO.fail=list.filter(function(x){ return x.state==='fail'; }).length;
    QINFO.dup=list.filter(function(x){ return x.state==='dup'; });
    drawQ();
    if(!it){ PUMPING=false; if(QINFO.fail) setTimeout(pump,15000); return; }
    var body=JSON.stringify(it), ctl=window.AbortController?new AbortController():null, to=setTimeout(function(){ if(ctl) ctl.abort(); },90000);
    fetch(GAS_URL,{method:'POST',body:body,signal:ctl?ctl.signal:undefined}).then(function(r){ return r.json(); }).then(function(d){
      clearTimeout(to);
      if(d&&d.success){ qDel(it.clientId,next); V.mine=null; }
      else if(d&&d.dup){ it.state='dup'; it.msg=d.msg; delete it.photos; qPut(it,next); }
      else { it.state='fail'; it.tries++; it.last=Date.now(); it.msg=(d&&d.msg)||''; qPut(it,next); }
    }).catch(function(){ clearTimeout(to); it.state='fail'; it.tries++; it.last=Date.now(); qPut(it,next); });
  });
  function next(){ PUMPING=false; setTimeout(pump,300); }
}
function drawQ(){
  var b=$('qbar'); if(!b) return;
  if(!QINFO.wait){ b.style.display='none'; } else {
    b.className='q'; b.style.display='block';
    b.innerHTML='📤 보내는 중 '+QINFO.wait+'건'+(QINFO.fail?' · 인터넷이 약해 자동으로 다시 보내는 중':'')+(QINFO.fail?'<button onclick="retryAll()">지금 다시</button>':'');
  }
  var l=$('qlist'); if(l) l.innerHTML=qListInner();
}
function retryAll(){ qAll(function(list){ var n=list.filter(function(x){ return x.state==='fail'; }); var k=n.length; if(!k) return pump(); n.forEach(function(x){ x.state='wait'; qPut(x,function(){ if(--k===0) pump(); }); }); }); }

function judgeOf(r){ var j=r.judge; if(typeof j==='string'){ try{ j=JSON.parse(j); }catch(e){ j=null; } } return j&&typeof j==='object'&&Object.keys(j).length?j:null; }

    h+='<div class="bc'+(b.join?' join':'')+'"><img src="'+b.p.dataUrl+'"><div>'+
      (b.join?'<div style="font-size:15px;color:var(--tx2);margin-bottom:6px">↑ 위 점포와 같은 점포 사진</div>':
      '<div class="row"><input class="inp" list="dl-ag" placeholder="대리점" value="'+esc(b.agency)+'" data-i="'+i+'" data-k="agency"'+(ME.role==='agency'?' disabled':'')+'>'+
      '<input class="inp" list="'+dl+'" placeholder="점포명" value="'+esc(b.storeName)+'" data-i="'+i+'" data-k="storeName"><input class="inp" placeholder="동" value="'+esc(b.dong)+'" data-i="'+i+'" data-k="dong"></div>'+
      '<datalist id="'+dl+'">'+L.map(function(s){ return '<option value="'+esc(s.n)+'">'+esc(s.d||'')+(s.ad?' · '+esc(s.ad):'')+'</option>'; }).join('')+'</datalist>'+
      (b.storeId?'<div style="font-size:14px;color:var(--g)">✓ 마켓체커 점포와 연결됨</div>':''))+
      '<div style="font-size:13px;color:var(--tx3)">'+esc(b.p.t||'촬영 시간 없음')+(b.p.warn?' · <span style="color:var(--red)">'+esc(b.p.warn)+'</span>':'')+'</div>'+
      '<div class="tools" style="margin-top:6px">'+(i>0?'<button onclick="bkJoin('+i+')">'+(b.join?'따로 등록':'↑ 위 점포와 같음')+'</button>':'')+(i>0&&!b.join?'<button onclick="bkCopy('+i+')">위와 같은 대리점·동</button>':'')+'<button onclick="V.bulk.splice('+i+',1);render()">빼기</button></div>'+
      '</div></div>';
  });
  if(V.bulk.length) h+='<button class="big go" onclick="bkSubmit()">모두 등록 ('+bkGroups().length+'곳, 사진 '+V.bulk.length+'장)</button><div class="msg" id="msg"></div>';
  return h+'</div>'+qList();
}
function bindBulk(){
  var inp=$('bk-in'), dr=$('drop');
  var add=function(fs){ fs=fs.filter(function(f){ return /^image\//.test(f.type); }); if(!fs.length) return; var left=fs.length, got=[];
    dr.innerHTML='사진 준비 중... '+fs.length+'장';
    fs.forEach(function(f){ prepFile(f,function(p){ if(p) got.push(p); if(--left===0){ got.sort(function(a,b){ return String(a.t)<String(b.t)?-1:1; });
      var ag=ME.role==='agency'?ME.name:(ls('wc_last_ag_'+ME.name,'')||'');
      got.forEach(function(p){ V.bulk.push({p:p,agency:ag,storeName:'',dong:'',storeId:'',join:false}); }); render(); } }); }); };
  if(inp) inp.onchange=function(e){ add([].slice.call(e.target.files||[])); };
  if(dr){ dr.ondragover=function(e){ e.preventDefault(); }; dr.ondrop=function(e){ e.preventDefault(); add([].slice.call(e.dataTransfer.files||[])); }; }
  [].forEach.call(document.querySelectorAll('.bulk input[data-i]'),function(el){ el.onchange=function(){ var b=V.bulk[+el.getAttribute('data-i')], k=el.getAttribute('data-k'); b[k]=el.value.trim();
    if(k==='agency'){ for(var j=+el.getAttribute('data-i')+1;j<V.bulk.length;j++) if(!V.bulk[j].agency) V.bulk[j].agency=b.agency; }  // 아래 빈 칸에도 같은 대리점
    if(k==='agency'||k==='storeName'){ var L=storesOf(b.agency).filter(function(s){ return norm(s.n)===norm(b.storeName); }); b.storeId=L.length===1?L[0].id:''; if(L.length===1&&!b.dong) b.dong=L[0].d||''; }
    render(); }; });
}
function bkJoin(i){ var b=V.bulk[i]; if(!b.join){ var gs=0; for(var k=i-1;k>=0&&V.bulk[k].join;k--) gs++; if(gs+2>MAXP){ alert('한 점포는 사진 '+MAXP+'장까지입니다'); return; } } b.join=!b.join; render(); }
function bkCopy(i){ var p=V.bulk[i-1]; for(var k=i-1;k>=0&&V.bulk[k].join;k--) p=V.bulk[k-1]||p; V.bulk[i].agency=p.agency; V.bulk[i].dong=p.dong; render(); }
function bkGroups(){ var G=[]; V.bulk.forEach(function(b){ if(b.join&&G.length&&G[G.length-1].length<MAXP) G[G.length-1].push(b); else G.push([b]); }); return G; }
function bkSubmit(){
  var G=bkGroups(), bad=G.filter(function(g){ var b=g[0]; return !b.agency||!b.storeName||(!b.storeId&&!b.dong); });
  if(bad.length){ showMsg('대리점·점포명·동이 빠진 사진이 '+bad.length+'곳 있어요.'); return; }
  G.forEach(function(g){ var b=g[0]; enqueue({agency:b.agency,storeName:b.storeName,dong:b.dong,storeId:b.storeId,photos:g.map(function(x){ var p=x.p; return {imageData:p.dataUrl,sha:p.sha,dhash:p.dhash,exifDate:p.exifDate,lastModified:p.lastModified,origW:p.origW,origH:p.origH,origSize:p.origSize}; })});
    var h=ls('wc_hist',[]); h.push({s:b.storeName,d:b.dong,a:b.agency,t:loc().slice(5,10).replace('-','/')}); lss('wc_hist',h.slice(-60)); });
  if(ME.role==='staff'&&G[0]) lss('wc_last_ag_'+ME.name,G[G.length-1][0].agency);
  V.bulk=[]; render(); showMsg('✅ '+G.length+'곳 접수했어요. 화면을 닫지 말고 잠시 기다려 주세요(상단 표시가 사라지면 완료).',true);
}

// ═════════ 시작 ═════════
if(WIDE) document.body.classList.add('wide');
var _c=ls('wc_cfg',null); if(_c) CFG=Object.assign(CFG,_c);
renderTop();
if(ME) lss('wc_me',ME);
render();
loadOffice(render);
if(!ME||!ME.office) fetch(GAS_URL+'?action=mcContestCfg').then(function(r){ return r.json(); }).then(function(d){ if(d&&d.cfg){ CFG=Object.assign(CFG,d.cfg); lss('wc_cfg',d.cfg); renderTop(); } }).catch(function(){});
pump();
window.addEventListener('online',retryAll);
</script>
